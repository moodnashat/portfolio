<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f6f8fa"/><text x="50" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Manufacturing Operations Dashboard</text><text x="50" y="85" font-family="Arial" font-size="15" fill="#667085">Synthetic manufacturing case study • production, quality &amp; downtime</text><g font-family="Arial"><rect x="50" y="115" width="250" height="100" rx="12" fill="white"/><rect x="320" y="115" width="250" height="100" rx="12" fill="white"/><rect x="590" y="115" width="250" height="100" rx="12" fill="white"/><rect x="860" y="115" width="290" height="100" rx="12" fill="white"/><text x="70" y="145" font-size="14" fill="#667085">TARGET UNITS</text><text x="70" y="185" font-size="28" font-weight="700" fill="#172033">6,000</text><text x="340" y="145" font-size="14" fill="#667085">PRODUCED</text><text x="340" y="185" font-size="28" font-weight="700" fill="#172033">5,982</text><text x="610" y="145" font-size="14" fill="#667085">DEFECTS</text><text x="610" y="185" font-size="28" font-weight="700" fill="#172033">176</text><text x="880" y="145" font-size="14" fill="#667085">DOWNTIME (MIN)</text><text x="880" y="185" font-size="28" font-weight="700" fill="#172033">356</text><rect x="50" y="245" width="520" height="200" rx="12" fill="white"/><text x="75" y="280" font-size="18" font-weight="700" fill="#172033">Production vs Target</text><line x1="100" y1="410" x2="520" y2="410" stroke="#d0d5dd"/><g fill="#4f46e5"><rect x="125" y="295" width="70" height="115"/><rect x="220" y="285" width="70" height="125"/><rect x="315" y="310" width="70" height="100"/><rect x="410" y="300" width="70" height="110"/></g><g fill="#98a2b3"><rect x="125" y="270" width="70" height="25"/><rect x="220" y="260" width="70" height="25"/><rect x="315" y="285" width="70" height="25"/><rect x="410" y="275" width="70" height="25"/></g><text x="125" y="430" font-size="13">Line A</text><text x="220" y="430" font-size="13">Line B</text><text x="315" y="430" font-size="13">Line C</text><text x="410" y="430" font-size="13">Overall</text><rect x="600" y="245" width="550" height="200" rx="12" fill="white"/><text x="625" y="280" font-size="18" font-weight="700" fill="#172033">Operational Focus</text><text x="625" y="320" font-size="15" fill="#344054">• Track defect rate by production line</text><text x="625" y="355" font-size="15" fill="#344054">• Prioritize high-downtime lines</text><text x="625" y="390" font-size="15" fill="#344054">• Compare output against target</text><text x="625" y="425" font-size="15" fill="#344054">• Use KPIs to support maintenance decisions</text><rect x="50" y="475" width="1100" height="170" rx="12" fill="white"/><text x="75" y="510" font-size="18" font-weight="700" fill="#172033">Business Questions</text><text x="75" y="545" font-size="15" fill="#344054">Which lines miss production targets? Which lines have the highest defect rates?</text><text x="75" y="575" font-size="15" fill="#344054">Where is downtime concentrated, and which operational areas should be investigated first?</text></g></svg>